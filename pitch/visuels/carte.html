<style>@font-face{font-family:'Nunito';src:url('file:///home/sam/hackathon-AMDchallenge-Samsam/app/node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2') format('woff2');font-weight:200 1000}
body{margin:0} #map{width:1600px;height:900px} .leaflet-tile-pane{filter:sepia(.35) saturate(.55) brightness(1.05) contrast(.9)}
.lab{font:800 22px 'Nunito',sans-serif;color:#2D2440;white-space:nowrap;background:#FFF9F3;border-radius:999px;padding:4px 12px;box-shadow:0 6px 16px -8px rgba(45,36,64,.6);display:inline-block}
.leaflet-control-attribution{font:12px 'Nunito',sans-serif}</style></head><body><div id="map"></div><script>
const m=L.map('map',{zoomControl:false,attributionControl:true,zoomSnap:0.25}).fitBounds([[42.5,-126],[56,-60]]);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© contributeurs OpenStreetMap',maxZoom:8}).addTo(m);
const P=[['#6A4CE0',30,'2027 · pilote',[[45.5,-73.57,'Montréal']]],
['#1F5FA8',20,'2028-2029 · tout le Québec',[[46.81,-71.21,'Québec'],[45.4,-71.89,''],[45.48,-75.7,''],[48.43,-71.07,'Saguenay'],[46.34,-72.54,''],[48.45,-68.52,'']]],
['#1E6F54',20,'2030 · Ontario',[[43.65,-79.38,'Toronto'],[45.42,-75.7,''],[42.98,-81.25,''],[46.49,-80.99,'']]],
['#8F4E0A',18,'2031 et après',[[49.9,-97.14,'Winnipeg'],[51.05,-114.07,'Calgary'],[53.55,-113.49,'Edmonton'],[49.28,-123.12,'Vancouver'],[44.65,-63.57,'Halifax'],[46.09,-64.78,'']]]];
for(const [c,r,_,pts] of P) for(const [la,lo,n] of pts){L.circleMarker([la,lo],{radius:r/2+4,color:'#FFF9F3',weight:4,fillColor:c,fillOpacity:1}).addTo(m); if(n) L.marker([la,lo],{icon:L.divIcon({className:'',html:'<span class="lab">'+n+'</span>',iconAnchor:(n==='Montréal'||n==='Toronto')?[150,-14]:[-18,14]})}).addTo(m)}
</script></body></html>
